[tool.poetry]
name = "womensafety-platform"
version = "1.0.0"
description = "Women Safety & Emergency Assistance Platform"
authors = ["Women Safety Platform Engineering <engineering@womensafety.org>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
Flask = ">=3.1.0"
SQLAlchemy = ">=2.0.0"
Werkzeug = ">=3.0.0"
bcrypt = ">=4.0.0"
cryptography = ">=42.0.0"
email-validator = ">=2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
